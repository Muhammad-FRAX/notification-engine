services:
  app:
    image: notification-engine:v1
    container_name: notification-engine
    build: .
    env_file: .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - notification-engine-msal:/data/msal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: notification-engine-db
    environment:
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notif
    volumes:
      - notification-engine-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  notification-engine-data:
    name: notification-engine-data
  notification-engine-msal:
    name: notification-engine-msal
